name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, TypeCheck & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_pass
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci_user:ci_pass@localhost:5432/ci_test
      JWT_SECRET: ci-jwt-secret-for-tests-only
      AUTH_SECRET: ci-auth-secret-for-tests-only
      CRON_SECRET: ci-cron-secret-for-tests-only

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push schema to test DB
        run: npx prisma db push --skip-generate

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test -- --run

      - name: N+1 Query Detection
        run: node scripts/check-n-plus-one.js

      - name: i18n Coverage Check
        run: node scripts/check-i18n.js

      - name: Lint check
        run: npx eslint . --max-warnings 225

      - name: Production Build Simulation
        run: node scripts/production-build.js
        env:
          NODE_ENV: production
