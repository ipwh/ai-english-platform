name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, TypeCheck & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_pass
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci_user:ci_pass@localhost:5432/ci_test
      # Enables the DB-gated integration suites (e.g. the IELTS concurrency
      # invariants in src/modules/ielts/__tests__/ielts-concurrency.integration.test.ts).
      # Same database as DATABASE_URL — the flag only lifts the skip guard.
      TEST_DATABASE_URL: postgresql://ci_user:ci_pass@localhost:5432/ci_test
      # The PostgreSQL integration suites MUST run in this workflow. Without this
      # flag a missing/renamed TEST_DATABASE_URL would silently SKIP the concurrency,
      # submission-atomicity and evidence-SQL invariants while CI stayed green
      # (fixed 2026-10-10, Sprint 134 — see src/shared/__tests__/database-gate.ts).
      REQUIRE_DATABASE: '1'
      # JWT_SECRET / AUTH_SECRET must be >= 32 characters (enforced by the schema in
      # src/shared/config/config.ts). Shorter placeholders made `next build` fail while
      # collecting page data for /api/admin/cleanup-mock-data — invisible until the build
      # step could actually run (2026-10-08).
      JWT_SECRET: ci-jwt-secret-for-tests-only-32-chars-min
      AUTH_SECRET: ci-auth-secret-for-tests-only-32-chars-min
      CRON_SECRET: ci-cron-secret-for-tests-only-32-chars-min
      # `next build` collects page data for every route, so modules that demand env vars at
      # import time must be satisfiable here: src/shared/auth/auth-next.ts reads
      # AUTH_GOOGLE_ID / AUTH_GOOGLE_SECRET at module scope (production supplies them on
      # Cloud Run). Placeholders are enough — no test exercises Google sign-in.
      AUTH_GOOGLE_ID: ci-google-client-id.apps.googleusercontent.com
      AUTH_GOOGLE_SECRET: ci-google-client-secret
      # /api/drive/download resolves its service-account key at module scope and throws
      # without a credential source. Nothing in the suite calls Google APIs, so a
      # placeholder object (never used to sign anything) is enough.
      GCP_SERVICE_ACCOUNT_JSON: '{"type":"service_account","project_id":"ci-test","private_key_id":"ci","private_key":"ci-placeholder","client_email":"ci-test@ci-test.iam.gserviceaccount.com","client_id":"0","token_uri":"https://oauth2.googleapis.com/token"}'

    steps:
      - uses: actions/checkout@v4

      # Node 22 = the production/deployment runtime (Dockerfile builder AND runner
      # are node:22-alpine). Prisma 7 requires ^20.19 || ^22.12 || >=24.0, so CI and
      # production must not drift onto different major versions.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      # 2026-10-10 (Sprint 136): the test database is initialized through the COMMITTED
      # provisioning path — baseline (prisma/baseline/schema-baseline.sql) → migration
      # history recorded → `prisma migrate deploy` asserted to be a no-op → `migrate diff`
      # asserted to report zero drift — instead of `prisma db push`. `db push` never
      # replays `prisma migrate deploy`, which is exactly how the broken migration chain
      # stayed invisible until it was reproduced by hand (2026-10-09).
      # The step also enables the pgvector extension (the script does it): the image SHIPS
      # it disabled, and `embeddingVector Unsupported("vector(1536)")` needs it.
      - name: Initialize test database (committed fresh-provisioning path)
        run: npm run db:provision:fresh:apply

      # 2026-10-09 (Sprint 135 P0), re-scoped 2026-10-10 (Sprint 136): this step re-asserts
      # the contract on a THROWAWAY database, independently of the test database that the
      # step above initialized. Previously the migration chain was exercised NOWHERE in CI
      # and could not be replayed from zero: migration #3
      # (`20260719_json_fields_migration`) assumes columns that no migration creates
      # (reproduced at HEAD 46707151 — apply #1 and #2 succeed, #3 aborts the transaction,
      # exit 1). The contract asserted here:
      #   empty DB → baseline (prisma/baseline/schema-baseline.sql) → migration history
      #   recorded (asserted to be EXACTLY the repository's migration set) →
      #   `prisma migrate deploy` is a NO-OP → `prisma migrate diff --exit-code` reports
      #   ZERO drift.
      # Exit codes: 0 ok · 1 verification failed (incl. drift, which is migrate-diff 2) ·
      # 2 usage/connection · 3 refused because the database is not empty. Any non-zero
      # fails the job, so a regression here cannot ship silently.
      - name: Fresh-database provisioning (empty DB → baseline → deploy no-op → zero drift)
        env:
          PROVISION_URL: postgresql://ci_user:ci_pass@localhost:5432/fresh_provision_test
        run: |
          node -e "const{Client}=require('pg');(async()=>{const c=new Client({connectionString:process.env.DATABASE_URL});await c.connect();await c.query('CREATE DATABASE fresh_provision_test');await c.end();console.log('fresh database created');})().catch((e)=>{console.error('fresh db create failed:',e.message);process.exit(1)});"

          # 1. Provision the empty database (asserts deploy no-op + zero drift internally).
          DATABASE_URL="$PROVISION_URL" DIRECT_DATABASE_URL="$PROVISION_URL" \
            npm run db:provision:fresh:apply

          # 2. Re-run safety: verifying the provisioned database must stay green.
          DATABASE_URL="$PROVISION_URL" DIRECT_DATABASE_URL="$PROVISION_URL" \
            npm run db:provision:verify

          # 3. Re-applying must REFUSE (exit 3) instead of touching an existing database.
          set +e
          DATABASE_URL="$PROVISION_URL" DIRECT_DATABASE_URL="$PROVISION_URL" \
            npm run db:provision:fresh:apply
          refusal_code=$?
          set -e
          if [ "$refusal_code" -ne 3 ]; then
            echo "ERROR: expected refusal exit 3 on a non-empty database, got $refusal_code"
            exit 1
          fi
          echo "Refusal exit 3 confirmed on a non-empty database."

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test -- --run

      - name: N+1 Query Detection
        run: node scripts/check-n-plus-one.js

      - name: i18n Coverage Check
        run: node scripts/check-i18n.js

      # Warning budget is a RATCHET: it may only ever be lowered. The 471 warnings that
      # accumulated while this step never ran (CI stopped earlier at the schema step since
      # 2026-09-21) were re-baselined 225 -> 480 on 2026-10-08 (ADR-050) so CI reported the
      # real state again. Sprint 132 burned 471 -> 259 (unused imports, stale disable
      # directives, prefer-const, stable hook deps, three rules promoted to `error`);
      # Sprint 133 removed a further 13 (the `{ omitted, ...rest }` omit idiom via the
      # documented `ignoreRestSiblings` option + genuinely dead bindings) -> 246 measured.
      # The per-rule ratchet lives in scripts/check-lint-budget.js — never raise either
      # number without a recorded decision.
      - name: Lint check
        run: npx eslint . --max-warnings 246

      # Per-rule ratchet: fails if ANY single rule exceeds its recorded budget, if a rule
      # that used to be clean starts warning again, or if there is any error. A total alone
      # would let debt move between rules unnoticed.
      - name: Lint budget (per-rule ratchet)
        run: node scripts/check-lint-budget.js

      # Builds the app exactly like the deployable image does (Dockerfile builder stage:
      # `npm run build`); migrations are applied by the Cloud Build `Migrate` step.
      #
      # scripts/production-build.js is deliberately NOT used here: it runs
      # `npx prisma migrate deploy` against the configured database as part of the build
      # (fail-closed when NODE_ENV=production), i.e. a deploy-time write that belongs to the
      # Cloud Build `Migrate` step and must not happen inside a CI build. The migration
      # contract is asserted explicitly by the provisioning steps above instead.
      - name: Production Build Simulation
        run: npm run build

      # Verifies the SHIPPED artifact, not the dependency graph: no tooling-only
      # package may reach `.next/standalone/node_modules`, and every package the
      # server externalises must be present. A missing externalised dependency is a
      # production-only failure that no unit test can catch (2026-10-09, Sprint 133).
      - name: Production artifact check
        run: npm run check:artifact
