# ============================================
# Cloud Build 設定 — GitHub push 自動部署
# 觸發條件：push 到 main 分支
# 不會覆蓋已設定的 Cloud Run 環境變數
# ============================================

steps:
  # Step 1: 建構 Docker 映像檔
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-east2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ai-english-platform/english-platform:$COMMIT_SHA'
      - '.'

  # Step 2: 推送映像檔
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-east2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ai-english-platform/english-platform:$COMMIT_SHA'

  # Step 3: 部署到 Cloud Run（不覆蓋環境變數）
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'english-platform'
      - '--image=asia-east2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ai-english-platform/english-platform:$COMMIT_SHA'
      - '--region=asia-east2'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--timeout=300'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=20'
      - '--concurrency=80'
      - '--cpu-boost'

images:
  - 'asia-east2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ai-english-platform/english-platform:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
